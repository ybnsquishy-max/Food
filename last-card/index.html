<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Card has moved</title>
<meta http-equiv="refresh" content="0; url=https://ybnsquishy-max.github.io/kitchen-apps/uno/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#101A36;color:#fff;font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;box-sizing:border-box;text-align:center;}
  a{display:inline-block;margin-top:16px;background:#FFC93C;color:#101A36;font-weight:700;text-decoration:none;padding:12px 20px;border-radius:12px;}
  p{max-width:32ch;margin:0 auto;color:#C9D2E8;}
</style>
</head>
<body>
  <div>
    <h1 style="margin:0 0 8px;font-size:24px;">Last Card has moved</h1>
    <p>The new Last Card has parties, photo scoring and your game history. If you added this one to your home screen, add the new one and delete this icon.</p>
    <a href="https://ybnsquishy-max.github.io/kitchen-apps/uno/">Open Last Card</a>
  </div>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (r.scope.endsWith('/last-card/')) r.unregister(); })).catch(() => {});
    location.replace('https://ybnsquishy-max.github.io/kitchen-apps/uno/');
  </script>
</body>
</html>
