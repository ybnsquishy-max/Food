name: Deploy Wind & Tide Watch

on:
  push:
    branches: [main]
    paths: ['wind-tide/**', '.github/workflows/deploy-wind-tide.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wind-tide-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-wind-tide
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build version
        run: |
          BUILD="$(date -u +%Y.%m.%d-%H%M)-${GITHUB_SHA::7}"
          mkdir -p _site
          cp -r wind-tide/. _site/
          sed -i "s/__BUILD__/${BUILD}/g" _site/sw.js _site/index.html
          echo "Built ${BUILD}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
