name: Deploy Mise app

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/deploy-app.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stamp a unique build id into the service worker and page. A changed
      # sw.js is what tells installed copies of the app to update themselves.
      - name: Stamp build version
        run: |
          BUILD="$(date -u +%Y.%m.%d-%H%M)-${GITHUB_SHA::7}"
          mkdir -p _site
          cp -r app/. _site/
          sed -i "s/__BUILD__/${BUILD}/g" _site/sw.js _site/index.html
          echo "Built ${BUILD}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
