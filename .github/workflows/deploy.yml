name: Deploy Apps (Mise + Wind & Tide)

on:
  push:
    branches: [main]
    paths: ['app/**', 'wind-tide/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp and prepare
        run: |
          BUILD="$(date -u +%Y.%m.%d-%H%M)-${GITHUB_SHA::7}"
          mkdir -p _site
          # Deploy Mise
          cp -r app/. _site/
          sed -i "s/__BUILD__/${BUILD}/g" _site/sw.js _site/index.html
          # Deploy Wind & Tide
          mkdir -p _site/wind-tide
          cp -r wind-tide/. _site/wind-tide/
          sed -i "s/__BUILD__/${BUILD}/g" _site/wind-tide/sw.js _site/wind-tide/index.html
          echo "Built ${BUILD}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
