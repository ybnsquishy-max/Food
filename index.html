<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Apps</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    max-width: 600px;
    width: 100%;
  }
  h1 {
    text-align: center;
    color: white;
    margin-bottom: 40px;
    font-size: 2.5rem;
  }
  .apps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
  }
  .app-card {
    background: white;
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .app-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  }
  .app-icon {
    font-size: 3rem;
    margin-bottom: 12px;
  }
  .app-name {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .app-desc {
    color: #666;
    font-size: 0.95rem;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🍚 Food Apps</h1>
  <div class="apps">
    <a href="/" class="app-card">
      <div class="app-icon">🍚</div>
      <div class="app-name">Mise</div>
      <div class="app-desc">Kitchen notes, methods & pantry</div>
    </a>
    <a href="/wind-tide/" class="app-card">
      <div class="app-icon">⛵</div>
      <div class="app-name">Wind & Tide</div>
      <div class="app-desc">Live weather & tide forecasts</div>
    </a>
  </div>
</div>

</body>
</html>
